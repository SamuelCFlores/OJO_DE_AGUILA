<sc-if value="{{ isC }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display:block">
<defs><clipPath id="oda-c-head"><path d="M15 96L13 58A30 30 0 0 1 36 14L72 24A32 32 0 0 1 94 56A8 8 0 0 0 86 47L58 46L82 52L66 60L70 96Z"></path></clipPath></defs>
<path d="M15 96L13 58A30 30 0 0 1 36 14L72 24A32 32 0 0 1 94 56A8 8 0 0 0 86 47L58 46L82 52L66 60L70 96Z" fill="{{ ink }}"></path>
<g clip-path="url(#oda-c-head)">
<rect x="72" y="0" width="40" height="100" fill="{{ acc }}"></rect>
<path d="M50 0V100M72 0V100" stroke="{{ det }}" stroke-width="{{ lw }}"></path>
<circle cx="50" cy="34" r="9.5" fill="none" stroke="{{ det }}" stroke-width="{{ lw }}"></circle>
</g>
<circle cx="50" cy="34" r="{{ spot }}" fill="{{ acc }}"></circle>
</svg>
</sc-if>
<sc-if value="{{ isR }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 100 100" width="100%" height="100%" style="display:block">
<g stroke="{{ ink }}" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M5 52L20 36L38 27L58 26L77 35L95 51L78 64L60 72L40 72L21 64Z" stroke-width="{{ lw }}"></path>
<sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
<path d="M38 27L54 49M54 49L95 51M54 49L21 64M54 49L60 72" stroke-width="2.2"></path>
</sc-if>
</g>
<g fill="{{ ink }}">
<circle cx="5" cy="52" r="{{ n1 }}"></circle><circle cx="20" cy="36" r="{{ n2 }}"></circle><circle cx="38" cy="27" r="{{ n3 }}"></circle><circle cx="58" cy="26" r="{{ n2 }}"></circle><circle cx="77" cy="35" r="{{ n3 }}"></circle><circle cx="95" cy="51" r="{{ n2 }}"></circle><circle cx="78" cy="64" r="{{ n2 }}"></circle><circle cx="60" cy="72" r="{{ n3 }}"></circle><circle cx="40" cy="72" r="{{ n2 }}"></circle><circle cx="21" cy="64" r="{{ n1 }}"></circle>
</g>
<circle cx="54" cy="49" r="{{ iris }}" fill="{{ acc }}"></circle>
<circle cx="54" cy="49" r="{{ pupil }}" fill="{{ det }}"></circle>
</svg>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:240},&quot;dir&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;voronoi&quot;,&quot;cancha&quot;,&quot;red&quot;],&quot;default&quot;:&quot;voronoi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;simple&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0B2545&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;acc&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8B100&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;det&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0B2545&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dir = this.props.dir ?? 'voronoi';
    const simple = !!this.props.simple;
    return {
      ink: this.props.ink ?? '#0B2545',
      acc: this.props.acc ?? '#E8B100',
      det: this.props.det ?? '#0B2545',
      brow: this.props.brow ?? this.props.acc ?? '#E8B100',
      fFull: dir === 'furia' && !simple,
      fSimple: dir === 'furia' && simple,
      vFull: dir === 'voronoi' && !simple,
      vSimple: dir === 'voronoi' && simple,
      isC: dir === 'cancha',
      isR: dir === 'red',
      full: !simple,
      lw: dir === 'cancha' ? (simple ? 6 : 4) : (simple ? 6 : 3.4),
      spot: simple ? 6 : 4.5,
      n1: simple ? 5.5 : 3.6, n2: simple ? 5.5 : 4.6, n3: simple ? 5.5 : 5.8,
      iris: simple ? 17 : 15, pupil: simple ? 7 : 6
    };
  }
}
</script>
