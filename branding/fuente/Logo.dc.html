<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"></helmet>
<sc-if value="{{ isH }}" hint-placeholder-val="{{ true }}">
<div style="display:inline-flex;align-items:center;gap:{{ gapH }}px;font-family:Poppins,sans-serif;color:{{ text }}">
<div style="width:{{ isoH }}px;height:{{ isoH }}px;flex:none;margin:{{ isoMarginH }}"><dc-import name="Isotipo" dir="{{ dir }}" ink="{{ ink }}" acc="{{ acc }}" det="{{ det }}" brow="{{ brow }}" simple="{{ simple }}" hint-size="100%,100%"></dc-import></div>
<div style="display:flex;flex-direction:column;gap:{{ tagGap }}px">
<div style="font-weight:700;font-size:{{ fs }}px;line-height:1;letter-spacing:0.02em;white-space:nowrap;padding-top:0.14em">OJO DE <span style="position:relative;display:inline-block">{{ aGlyph }}<sc-if value="{{ goldAccent }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:0.3em;top:-0.14em;width:0.24em;height:0.17em;background:{{ accent }};clip-path:polygon(52% 0,100% 0,40% 100%,0 100%)"></span></sc-if></span>GUILA</div>
<sc-if value="{{ tagline }}" hint-placeholder-val="{{ false }}"><div style="font-weight:500;font-size:{{ tagFs }}px;line-height:1.3;letter-spacing:0.005em;white-space:nowrap">La intuición del entrenador, convertida en evidencia.</div></sc-if>
</div>
</div>
</sc-if>
<sc-if value="{{ isV }}" hint-placeholder-val="{{ false }}">
<div style="display:inline-flex;flex-direction:column;align-items:center;font-family:Poppins,sans-serif;color:{{ text }};text-align:center">
<div style="width:{{ isoV }}px;height:{{ isoV }}px;margin:{{ isoMarginV }}"><dc-import name="Isotipo" dir="{{ dir }}" ink="{{ ink }}" acc="{{ acc }}" det="{{ det }}" brow="{{ brow }}" simple="{{ simple }}" hint-size="100%,100%"></dc-import></div>
<div style="font-weight:600;font-size:{{ fsSmall }}px;line-height:1;letter-spacing:0.44em;margin-right:-0.44em;white-space:nowrap;margin-top:{{ vGap }}px">OJO DE</div>
<div style="font-weight:700;font-size:{{ fsBig }}px;line-height:1;letter-spacing:0.02em;white-space:nowrap;margin-top:0.32em"><span style="position:relative;display:inline-block">{{ aGlyph }}<sc-if value="{{ goldAccent }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:0.3em;top:-0.14em;width:0.24em;height:0.17em;background:{{ accent }};clip-path:polygon(52% 0,100% 0,40% 100%,0 100%)"></span></sc-if></span>GUILA</div>
<sc-if value="{{ tagline }}" hint-placeholder-val="{{ false }}"><div style="font-weight:500;font-size:{{ tagFsV }}px;line-height:1.35;margin-top:0.9em;max-width:16em;text-wrap:balance">La intuición del entrenador, convertida en evidencia.</div></sc-if>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:220},&quot;dir&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;voronoi&quot;,&quot;cancha&quot;,&quot;red&quot;],&quot;default&quot;:&quot;voronoi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;h&quot;,&quot;v&quot;],&quot;default&quot;:&quot;h&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;color&quot;,&quot;dark&quot;,&quot;mono&quot;,&quot;monoInv&quot;],&quot;default&quot;:&quot;color&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;min&quot;:12,&quot;max&quot;:200,&quot;tsType&quot;:&quot;number&quot;},&quot;tagline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;goldAccent&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;simple&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const N = '#0B2545', G = '#E8B100', W = '#FFFFFF';
    const dir = this.props.dir ?? 'voronoi';
    const theme = this.props.theme ?? 'color';
    const layout = this.props.layout ?? 'h';
    const size = this.props.size ?? 40;
    const gold = this.props.goldAccent ?? true;
    const P = {
      color:   { text: N, accent: G, voronoi: [N, G, N], cancha: [N, G, W], red: [N, G, N], furia: [N, G, N, G] },
      dark:    { text: W, accent: G, voronoi: [W, G, N], cancha: [W, G, N], red: [W, G, N], furia: [W, G, N, G] },
      mono:    { text: N, accent: N, voronoi: [N, W, N], cancha: [N, N, W], red: [N, N, W], furia: [N, W, N, N] },
      monoInv: { text: W, accent: W, voronoi: [W, N, W], cancha: [W, W, N], red: [W, W, N], furia: [W, N, W, W] }
    }[theme] || {};
    const [ink, acc, det, brow] = P[dir] || [N, G, N];
    // per-direction optical sizing (symbol boxes are 100x100 with different fill)
    const k = { voronoi: { h: 2.7, t: 0.22, b: 0.22, v: 3.4 }, cancha: { h: 1.9, t: 0.12, b: 0.03, v: 2.6 }, red: { h: 2.5, t: 0.19, b: 0.19, v: 3.2 }, furia: { h: 2.6, t: 0.16, b: 0.2, v: 3.3 } }[dir];
    const isoH = Math.round(size * k.h);
    const isoV = Math.round(size * k.v);
    const ac = gold;
    return {
      dir, ink, acc, det, brow: brow ?? acc, text: P.text, accent: P.accent,
      simple: !!this.props.simple,
      isH: layout === 'h', isV: layout === 'v',
      goldAccent: ac, aGlyph: ac ? 'A' : 'Á',
      fs: size, isoH, gapH: Math.round(size * 0.42),
      isoMarginH: `${-Math.round(isoH * k.t)}px 0 ${-Math.round(isoH * k.b)}px`,
      tagline: !!this.props.tagline, tagFs: Math.round(size * 0.29 * 10) / 10, tagGap: Math.round(size * 0.32),
      isoV, isoMarginV: `${-Math.round(isoV * k.t)}px 0 ${-Math.round(isoV * k.b)}px`, vGap: Math.round(size * 0.55),
      fsSmall: Math.round(size * 0.6), fsBig: Math.round(size * 1.05), tagFsV: Math.round(size * 0.36)
    };
  }
}
</script>
</body>
</html>
