# Umbrales del framework analítico. Cada clave se define en contexto/framework.md.
# Valores iniciales (framework v0); se confirman con la prueba de humo y el inspector.
# Solo parámetros analíticos: la configuración técnica de la API vive en src/ojo/ingesta/.

# Ids reales de la API (prueba de humo, 2026-10-07). season_id es el año: junta Apertura y Clausura;
# el torneo se separa con competition_stage.name.
equipo: {nombre: "América", team_id: 1229}
entrenador: {nombre: "André Jardine", manager_id: 1000116}   # 2023-07-01 → 2026-05-11
predecesores:
  - {nombre: "Santiago Solari", manager_id: 25}             # 2021-07-23 → 2022-03-02
  - {nombre: "Fernando Ortiz", manager_id: 1001173}         # 2022-03-06 → 2023-05-22
# 108 = 2021/22, 235 = 2022/23, 281 = 2023/24, 317 = 2024/25, 318 = 2025/26.
# 351 (2026/27, en curso, sin Jardine) queda fuera.
liga: {competition_name: "Liga MX", competition_id: 73, season_ids: [108, 235, 281, 317, 318]}
# Torneo de prueba que el modelo no ve hasta la evaluación final (contexto/framework.md, "Validación, causalidad y decisión").
# plan_b: si los organizadores no permiten datos posteriores al CL25 (entrenamiento AP23–AP24).
validacion:
  season_id_prueba: 318          # 2025/26
  torneo_prueba: "Clausura"
  plan_b: {season_id_prueba: 317, torneo_prueba: "Clausura"}
relevos: {min_partidos: 5, ventana_partidos: 10}   # interinatos < 5 partidos no cuentan

campo: {largo: 120, ancho: 80, porteria: [120, 40]}
tercios: {defensivo_max_x: 40, final_min_x: 80}
presion: {campo_rival_min_x: 60, ultimo_tercio_min_x: 80, ppda_zona_max_x: 72}   # 72 = 60 % de la cancha desde la portería del rival
transicion: {fuente: "is_transition", plan_b_segundos: 10}
pase_progresivo: {avance_min_yd: 10, cuenta_entrada_area: true}
balon_parado: {lateral_peligro_min_x: 80}
tramos_min: 15            # 5 para lectura fina del flujo
red_pases: {min_pases_arista: 3}
voronoi:
  min_dist_borde: 2.0        # se excluyen jugadores (salvo el actor) a menos de esto del borde visible
  alcance_max_yd: 20         # radio máximo de la celda de cada jugador (zonas vacías no cuentan)
  min_borde_arista_yd: 0.5   # borde compartido mínimo para que dos jugadores sean vecinos
  momentos: [pase_progresivo, progresion_rival, envio_balon_parado]
simulacion: {repeticiones: 10000, semilla: 42, forma_partidos: 5}
resumenes: {min_partidos: 3, rejilla: {columnas: 12, filas: 8}}   # explorador del reporte (contexto/resumenes.md)
estadistica: {bootstrap_repeticiones: 2000, nivel_confianza: 0.95, min_eventos_zona: 30}   # intervalos y mapas de las exploraciones
