[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ojo-de-aguila"
version = "0.1.0"
description = "Motor analítico reutilizable sobre las APIs de StatsBomb; primer caso: el América de André Jardine."
requires-python = ">=3.12"
# Las dependencias con versión fija viven solo en requirements.txt
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
